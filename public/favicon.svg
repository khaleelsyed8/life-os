<!-- STEP 1: Create favicon.svg in your public folder -->
<!-- Save this as public/favicon.svg -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="url(#grad)"/>
  
  <!-- Sparkle -->
  <path d="M 32,12 L 36,28 L 52,32 L 36,36 L 32,52 L 28,36 L 12,32 L 28,28 Z" 
        fill="#fbbf24" 
        stroke="white" 
        stroke-width="1.5"/>
  
  <!-- Small dots -->
  <circle cx="32" cy="8" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="44" cy="20" r="1.2" fill="white" opacity="0.8"/>
  <circle cx="56" cy="32" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="44" cy="44" r="1.2" fill="white" opacity="0.8"/>
  <circle cx="32" cy="56" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="20" cy="44" r="1.2" fill="white" opacity="0.8"/>
  <circle cx="8" cy="32" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="20" cy="20" r="1.2" fill="white" opacity="0.8"/>
</svg>